name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Test
        run: node test/run.js

      - name: Package VSIX
        run: npm run package:release

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-jailbreak-lab
          path: '*.vsix'
